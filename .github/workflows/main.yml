name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          set -e
          mkdir -p proj/app/src/main/assets proj/app/src/main/res/values proj/app/src/main/java/com/example/shamsiui
          cd proj

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://api.xposed.info/")
                      content { includeGroup("de.robv.android.xposed") }
                  }
              }
          }
          rootProject.name = "ShamsiSystemUI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.shamsiui"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.shamsiui"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt() + 100
                  versionName = "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
                  
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -keep class com.example.shamsiui.MainHook { *; }
          -keep class de.robv.android.xposed.** { *; }
          -keepclassmembers class * extends de.robv.android.xposed.IXposedHookLoadPackage {
              public void handleLoadPackage(...);
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Shamsi SystemUI">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription"
                      android:value="Persian (Jalali) date in SystemUI" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/arrays.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.android.systemui</item>
              </string-array>
          </resources>
          EOF

          echo "com.example.shamsiui.MainHook" > app/src/main/assets/xposed_init

          cat > app/src/main/java/com/example/shamsiui/MainHook.kt <<'EOF'
          package com.example.shamsiui

          import android.content.Context
          import android.icu.text.SimpleDateFormat
          import android.icu.util.ULocale
          import android.widget.TextClock
          import android.widget.TextView
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XposedBridge
          import de.robv.android.xposed.XposedHelpers
          import de.robv.android.xposed.callbacks.XC_LoadPackage
          import java.io.File
          import java.util.Date

          class MainHook : IXposedHookLoadPackage {

              companion object {
                  const val TRACE = false

                  private const val TAG = "ShamsiUI"
                  private val seen = HashSet<String>()
                  private var logFile: File? = null

                  private const val DAY = "(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*"
                  private const val MON = "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*"
                  private val dateOnly = Regex("^$DAY,?\\s+(?:\\d{1,2}\\s+$MON|$MON\\s+\\d{1,2})$")
                  private val dayOnly  = Regex("^$DAY$")
                  private val monDay   = Regex("^$MON\\s+\\d{1,2}$")
                  private val quoted = Regex("'[^']*'")
                  private val dateLetters = Regex("[EMdyLc]")
                  private val timeLetters = Regex("[hHkKmsaSzZ]")

                  private val faLocale by lazy { ULocale("fa_IR@calendar=persian") }

                  fun persian(pattern: String): String =
                      SimpleDateFormat(pattern, faLocale).format(Date())

                  fun fileLog(ctx: Context?, msg: String) {
                      XposedBridge.log("$TAG: $msg")
                      try {
                          if (logFile == null && ctx != null) {
                              val dir = ctx.getExternalFilesDir(null) ?: ctx.filesDir
                              logFile = File(dir, "shamsi_log.txt")
                          }
                          logFile?.appendText("${System.currentTimeMillis()}  $msg\n")
                      } catch (_: Throwable) {}
                  }

                  fun logOnce(ctx: Context?, msg: String) {
                      if (seen.add(msg)) fileLog(ctx, msg)
                  }
              }

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  if (lpparam.packageName != "com.android.systemui") return
                  XposedBridge.log("$TAG: loaded in SystemUI")
                  hookDateView(lpparam)
                  hookSetText()
              }

              private fun hookDateView(lpparam: XC_LoadPackage.LoadPackageParam) {
                  try {
                      XposedHelpers.findAndHookMethod(
                          "com.android.systemui.statusbar.policy.DateView",
                          lpparam.classLoader,
                          "updateClock",
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      val tv = param.thisObject as TextView
                                      tv.text = persian("EEEE d MMMM")
                                  } catch (t: Throwable) {
                                      fileLog(null, "DateView error: $t")
                                  }
                              }
                          }
                      )
                      XposedBridge.log("$TAG: DateView hooked")
                  } catch (t: Throwable) {
                      XposedBridge.log("$TAG: DateView hook failed: $t")
                  }
              }

              private fun hookSetText() {
                  try {
                      XposedHelpers.findAndHookMethod(
                          TextView::class.java,
                          "setText",
                          CharSequence::class.java,
                          TextView.BufferType::class.java,
                          object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  try {
                                      val v = param.thisObject as TextView
                                      val old = param.args[0]?.toString() ?: return

                                      if (v is TextClock) {
                                          val pattern = listOf("mFormat", "mFormat12", "mFormat24")
                                              .mapNotNull {
                                                  runCatching {
                                                      XposedHelpers.getObjectField(v, it)?.toString()
                                                  }.getOrNull()
                                              }
                                              .firstOrNull { it.isNotEmpty() }
                                          if (pattern != null) {
                                              val bare = pattern.replace(quoted, "")
                                              if (dateLetters.containsMatchIn(bare) &&
                                                  !timeLetters.containsMatchIn(bare)
                                              ) {
                                                  val new = persian(pattern)
                                                  param.args[0] = new
                                                  if (TRACE) logOnce(v.context,
                                                      "CLOCK pattern=$pattern -> $new")
                                                  return
                                              }
                                          }
                                      }

                                      if (v is TextClock) {
                                          when {
                                              dayOnly.matches(old) -> {
                                                  param.args[0] = persian("EEEE")
                                                  if (TRACE) logOnce(v.context,
                                                      "CLOCK-DAY $old -> ${param.args[0]}")
                                                  return
                                              }
                                              monDay.matches(old) -> {
                                                  param.args[0] = persian("d MMMM")
                                                  if (TRACE) logOnce(v.context,
                                                      "CLOCK-MON $old -> ${param.args[0]}")
                                                  return
                                              }
                                          }
                                      }

                                      if (old.length <= 30 && dateOnly.matches(old)) {
                                          val new = persian("EEE d MMM")
                                          param.args[0] = new
                                          if (TRACE) {
                                              val idName = try {
                                                  v.resources.getResourceEntryName(v.id)
                                              } catch (_: Throwable) { "no-id" }
                                              logOnce(v.context,
                                                  "TEXT class=${v.javaClass.name} id=$idName: $old -> $new")
                                          }
                                      }
                                  } catch (_: Throwable) {}
                              }
                          }
                      )
                  } catch (t: Throwable) {
                      XposedBridge.log("$TAG: setText hook failed: $t")
                  }
              }
          }
          EOF

      - name: Use MainHook.kt from repo
        run: |
          if [ -f MainHook.kt ]; then cp MainHook.kt proj/app/src/main/java/com/example/shamsiui/MainHook.kt; fi

      - name: Build release APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShamsiSystemUI-release
          path: proj/app/build/outputs/apk/release/*.apk
