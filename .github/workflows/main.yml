name: Build and Generate Generic Hook

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Generate Generic Hook.kt in Source Tree
      run: |
        mkdir -p app/src/main/java/com/example/analogclock
        cat << 'EOF' > app/src/main/java/com/example/analogclock/Hook.kt
        package com.example.analogclock

        import android.content.Context
        import android.os.PowerManager
        import android.view.Display
        import android.service.dreams.DreamService
        import de.robv.android.xposed.XC_MethodHook
        import de.robv.android.xposed.XposedHelpers

        object HookUtils {
            fun applyLocks(cl: ClassLoader, dead: Boolean, enableFile: java.io.File, readAllConfig: () -> Map<String, String>, write: (String) -> Unit) {
                try {
                    XposedHelpers.findAndHookMethod(
                        "android.service.dreams.DreamService", cl,
                        "setDozeScreenState", Int::class.javaPrimitiveType,
                        object : XC_MethodHook() {
                            override fun beforeHookedMethod(p: MethodHookParam) {
                                if (dead) return
                                try {
                                    val requested = p.args[0] as Int
                                    if (requested == 4 && enableFile.exists()) {
                                        val cfg = readAllConfig()
                                        val aodMode = cfg["aod_awake"]?.lowercase()
                                        if (aodMode == null || aodMode == "1" || aodMode == "true") {
                                            p.args[0] = 3
                                        }
                                    }
                                } catch (_: Throwable) {}
                            }
                        }
                    )
                } catch (t: Throwable) { write("AOD Generic Hook Fail: $t") }

                try {
                    val mediatorClass = "com.android.systemui.keyguard.KeyguardViewMediator"
                    XposedHelpers.findAndHookMethod(mediatorClass, cl, "onStartedWakingUp", object : XC_MethodHook() {
                        override fun afterHookedMethod(param: MethodHookParam) {
                            try {
                                val cfg = readAllConfig()
                                val timeout = cfg["lock_timeout"]?.toLongOrNull() ?: return
                                if (timeout > 0) {
                                    val ctx = XposedHelpers.getObjectField(param.thisObject, "mContext") as? Context ?: return
                                    val pm = ctx.getSystemService(Context.POWER_SERVICE) as? PowerManager ?: return
                                    val wl = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP, "SystemUI:GenericLockTimeout")
                                    wl.acquire(timeout)
                                }
                            } catch (_: Throwable) {}
                        }
                    })
                } catch (t: Throwable) { write("Generic Lock Timeout Hook Fail: $t") }
            }
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnalogClock-Release
        path: app/build/outputs/apk/release/*.apk
